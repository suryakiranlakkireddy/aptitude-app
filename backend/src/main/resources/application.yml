server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aptitude_app}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

app:
  jwt:
    secret: ${JWT_SECRET:change-this-secret-to-a-long-random-value-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  subscription:
    price-inr: 59
    validity-months: 4
  supabase:
    url: ${SUPABASE_URL:}
    service-key: ${SUPABASE_SERVICE_KEY:}
    bucket: ${SUPABASE_BUCKET:aptitude-app-files}
  firebase:
    service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
