<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Users - Admin</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav>
    <a href="dashboard.html">Dashboard</a>
    <a href="topics.html">Topics</a>
    <a href="quizzes.html">Quizzes</a>
    <a href="notes.html">Notes</a>
    <a href="users.html">Users</a>
    <a href="#" onclick="logoutAdmin()">Log out</a>
  </nav>
  <div class="container wide">
    <h1>Users</h1>
    <h2>All registered students (read-only here; each student's quiz progress stays private to them)</h2>
    <table id="table">
      <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Joined</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <script src="js/api.js"></script>
  <script>
    requireAdmin();
    (async () => {
      const users = await apiRequest('/admin/users');
      document.querySelector('#table tbody').innerHTML = users.map(u => `
        <tr>
          <td>${u.fullName}</td>
          <td>${u.email}</td>
          <td>${u.role}</td>
          <td>${(u.createdAt || '').split('T')[0]}</td>
        </tr>
      `).join('');
    })();
  </script>
</body>
</html>
