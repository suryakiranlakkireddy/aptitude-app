<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aptitude App - Admin Login</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <h1>Admin Login</h1>
    <h2>Aptitude App content management</h2>
    <div id="error" class="error" style="display:none"></div>
    <label>Email</label>
    <input id="email" type="email" placeholder="admin@example.com">
    <label>Password</label>
    <input id="password" type="password" placeholder="********">
    <button onclick="login()">Log in</button>
    <p style="font-size:12px;color:#8a94a6;margin-top:16px">
      Note: the account used here must have role ADMIN in the database.
      Promote a user by setting their <code>role</code> column to <code>ADMIN</code>.
    </p>
  </div>
  <script src="js/api.js"></script>
  <script>
    async function login() {
      const errorEl = document.getElementById('error');
      errorEl.style.display = 'none';
      try {
        const res = await apiRequest('/auth/login', {
          method: 'POST',
          body: {
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
          },
        });
        if (res.role !== 'ADMIN') {
          errorEl.textContent = 'This account is not an admin.';
          errorEl.style.display = 'block';
          return;
        }
        localStorage.setItem('admin_token', res.token);
        localStorage.setItem('admin_role', res.role);
        window.location.href = 'dashboard.html';
      } catch (e) {
        errorEl.textContent = e.message;
        errorEl.style.display = 'block';
      }
    }
  </script>
</body>
</html>
